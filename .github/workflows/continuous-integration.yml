name: "Continuous integration"

on:
  workflow_call:
    inputs:
      plugin-key:
        required: true
        type: string
      glpi-version:
        required: true
        type: string
      php-version:
        required: true
        type: string
      db-image:
        required: true
        type: string
      init-script:
        required: false
        type: string
        default: ""
      extra-services:
        description: "A list of coma separated services. Available services: openldap."
        required: false
        type: string
        default: ""
      skip-changelog-check:
        description: "Set to true to skip the CHANGELOG update check on pull requests."
        required: false
        type: boolean
        default: false
    secrets:
      extra-env:
        description: "Optional newline-separated KEY=VALUE pairs, exposed as environment variables during the PHPUnit step."
        required: false

jobs:
  ci:
    name: "Continuous integration"
    runs-on: "ubuntu-latest"
    container:
      image: "ghcr.io/glpi-project/githubactions-glpi-apache:php-${{ inputs.php-version }}-glpi-${{ inputs.glpi-version }}"
      # `--user github-actions-runner` is mandatory to prevent rights issues on mounted volume during checkout operation
      options: >-
        --volume ${{ github.workspace }}:/var/www/glpi/plugins:rw
        --user github-actions-runner
    services:
      db:
        image: "ghcr.io/glpi-project/githubactions-${{ inputs.db-image }}"
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: "glpi"
        options: >-
          --shm-size=1g
      openldap:
        # Workaround to only add the service if a given variable is set.
        # See: https://github.com/actions/runner/issues/822
        image: "${{ contains(inputs.extra-services, 'openldap') && 'osixia/openldap:latest' || '' }}"
        env:
          LDAP_ORGANISATION: "GLPI"
          LDAP_DOMAIN: "glpi.org"
          LDAP_ADMIN_USERNAME: "admin"
          LDAP_ADMIN_PASSWORD: "admin"
    defaults:
      run:
        # By default, execute commands using the `www-data` user to prevent rights issues on GLPI generated files.
        shell: "sudo --set-home --user=www-data --preserve-env bash --noprofile --norc -eo pipefail {0}"
        working-directory: "/var/www/glpi/plugins/${{ inputs.plugin-key }}"
    env:
      CACHE_DIR: "/home/www-data/.cache/continuous-integration-workflow"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
        with:
          path: "${{ inputs.plugin-key }}"
      - name: "Detect coverage configuration"
        id: "coverage-config"
        # Use default `bash` shell with `github-actions-runner` user
        shell: "bash"
        working-directory: "${{ github.workspace }}/${{ inputs.plugin-key }}"
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.base_ref }}" != "${{ github.event.repository.default_branch }}" ]]; then
            echo "coverage-enabled=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Code coverage is disabled for pull requests targeting non-default branch (${{ github.base_ref }})."
            exit 0
          fi

          CONFIG_FILE=".glpi-coverage.json"
          if [[ -f "$CONFIG_FILE" ]]; then
            ENABLED=$(jq -r '.enabled // true' "$CONFIG_FILE")
            if [[ "$ENABLED" != "true" ]]; then
              echo "coverage-enabled=false" >> $GITHUB_OUTPUT
              echo "ℹ️ Code coverage is disabled via $CONFIG_FILE"
              exit 0
            fi
            echo "coverage-enabled=true" >> $GITHUB_OUTPUT
          else
            echo "coverage-enabled=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No $CONFIG_FILE found, code coverage is disabled."
            exit 0
          fi
      - name: "Execute init script"
        if: ${{ inputs.init-script != '' }}
        # Use default `bash` shell with `github-actions-runner` user
        shell: "bash"
        run: |
          bash --noprofile --norc ${{ inputs.init-script }}
      - name: "Configure cache directories"
        if: ${{ !cancelled() }}
        # Use default `bash` shell with `github-actions-runner` user
        shell: "bash"
        run: |
          sudo mkdir --parents "${{ env.CACHE_DIR }}/npm"
          sudo mkdir --parents "${{ env.CACHE_DIR }}/composer"
          sudo chown --recursive github-actions-runner "${{ env.CACHE_DIR }}"
          npm config set cache "${{ env.CACHE_DIR }}/npm"
          composer config cache-dir "${{ env.CACHE_DIR }}/composer"
      - name: "Restore cache"
        if: ${{ !cancelled() }}
        uses: "actions/cache@v6"
        with:
          path: |
            ${{ env.CACHE_DIR }}
          key: "${{ inputs.plugin-key }}-dependencies-${{ inputs.php-version }}-${{ github.job }}-${{ hashFiles('**/composer.lock', '**/package-lock.json') }}"
          restore-keys: |
            ${{ inputs.plugin-key }}-dependencies-${{ inputs.php-version }}-${{ github.job }}-
            ${{ inputs.plugin-key }}-dependencies-${{ inputs.php-version }}-
            ${{ inputs.plugin-key }}-dependencies-
      - name: "Fix directories ACL"
        if: ${{ !cancelled() }}
        # Use default `bash` shell with `github-actions-runner` user
        shell: "bash"
        run: |
          sudo setfacl --recursive --modify u:www-data:rwx "${{ env.CACHE_DIR }}"
          sudo setfacl --recursive --modify u:www-data:rwx /var/www/glpi/plugins
      - name: "Install composer dependencies"
        if: ${{ !cancelled() && hashFiles(format('{0}/composer.json', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mMark plugin directory as safe...\033[0m"
          git config --global --add safe.directory "/var/www/glpi/plugins/${{ inputs.plugin-key }}"
          echo -e "\033[0;33mExecuting Composer install...\033[0m"
          composer install --ansi --no-interaction --no-progress --prefer-dist
      - name: "Check for common dependencies"
        if: ${{ !cancelled() && hashFiles(format('{0}/composer.json', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mChecking for common dependencies between plugin and core...\033[0m"
          PLUGIN_PROD_JSON=$(composer show --direct --no-dev --format=json)
          CORE_PROD_JSON=$(cd ../../ && composer show --direct --no-dev --format=json)
          CORE_ALL_JSON=$(cd ../../ && composer show --direct --format=json)
          PLUGIN_PROD_NAMES=$(echo "$PLUGIN_PROD_JSON" | jq -r '(.installed? // [])[] | .name')
          CORE_PROD_NAMES=$(echo "$CORE_PROD_JSON" | jq -r '(.installed? // [])[] | .name')
          HAS_ISSUE='false'
          for plugin_dep in $PLUGIN_PROD_NAMES; do
            if [[ "$plugin_dep" == "glpi-project/tools" ]]; then
              continue
            fi
            if echo "$CORE_PROD_NAMES" | grep -qx "$plugin_dep"; then
              echo "❌ Conflict: '$plugin_dep' is present in both plugin and core production dependencies."
              HAS_ISSUE='true'
              continue
            fi
            CORE_VERSION=$(echo "$CORE_ALL_JSON" | jq -r --arg n "$plugin_dep" '(.installed? // [])[] | select(.name == $n) | .version')
            if [[ -n "$CORE_VERSION" ]]; then
              PLUGIN_VERSION=$(echo "$PLUGIN_PROD_JSON" | jq -r --arg n "$plugin_dep" '(.installed? // [])[] | select(.name == $n) | .version')
              if [[ "$PLUGIN_VERSION" != "$CORE_VERSION" ]]; then
                echo "❌  Version mismatch: '$plugin_dep' is a GLPI core dev dependency (${CORE_VERSION}) but plugin requires ${PLUGIN_VERSION}. This may cause issues in local development."
                HAS_ISSUE='true'
              fi
            fi
          done
          if [[ "$HAS_ISSUE" == 'true' ]]; then
            echo -e "\033[0;31mDependency issues detected. Please resolve them before proceeding.\033[0m"
            exit 1
          fi
          echo "✅ No dependency conflicts detected."
      - name: "Install npm dependencies"
        if: ${{ !cancelled() && hashFiles(format('{0}/package.json', inputs.plugin-key)) != '' }}
        run: |
          npm install --no-save
      # We now need to load the ldif data in the openldap server.
      # TODO: bake the .ldif directly in a custom image so we don't need to do this.
      - name: "Import LDIF"
        if: ${{ contains(inputs.extra-services, 'openldap') }}
        run: |
          ldapadd -x -D "cn=admin,dc=glpi,dc=org" -w admin \
            -f ../../tests/LDAP/ldif/10-users.ldif \
            -H ldap://openldap:389
      - name: "Check CHANGELOG update"
        if: ${{ !cancelled() && !inputs.skip-changelog-check && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && (hashFiles(format('{0}/CHANGELOG.md', inputs.plugin-key)) != '' || hashFiles(format('{0}/CHANGELOG', inputs.plugin-key)) != '') }}
        shell: "bash"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_files=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            | jq -r '{
                has_changelog: ([.[].filename] | any(test("CHANGELOG"; "i"))),
                exempt:        ([.[].filename] | all(test("^locales/|^\\.github/"; "i")))
              }')
          if [[ $(echo "$pr_files" | jq -r '.exempt') == "true" ]]; then
            echo "✅ Locale/CI-only PR, skipping CHANGELOG check."
            exit 0
          fi
          if [[ $(echo "$pr_files" | jq -r '.has_changelog') != "true" ]]; then
            echo "❌ CHANGELOG was not updated in this PR."
            exit 1
          fi
          echo "✅ CHANGELOG updated."
      - name: "Detect XML manifest modification"
        id: "detect-xml-modification"
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (hashFiles(format('{0}/plugin.xml', inputs.plugin-key)) != '' || hashFiles(format('{0}/{1}.xml', inputs.plugin-key, inputs.plugin-key)) != '') }}
        shell: "bash"
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_KEY: ${{ inputs.plugin-key }}
        run: |
          pr_files=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            | jq -r '[.[].filename]')
          if echo "$pr_files" | jq -e --arg k "$PLUGIN_KEY" '. | any(. == "plugin.xml" or . == ($k + ".xml"))' > /dev/null; then
            echo "xml_modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "xml_modified=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "Check XML URLs validity"
        if: ${{ !cancelled() && steps.detect-xml-modification.outputs.xml_modified == 'true' }}
        shell: "bash"
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_KEY: ${{ inputs.plugin-key }}
        run: |
          # URLs added in this PR inside <download_url> tags point to archives not yet published
          new_download_urls=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            | jq -r --arg k "$PLUGIN_KEY" '[.[] | select(.filename == "plugin.xml" or .filename == ($k + ".xml")) | .patch // ""] | join("\n")' \
            | grep '^+' | grep '<download_url>' | grep -oP 'https?://[^\s<>"]+' | sort -u || true)
          echo -e "\033[0;33mChecking URLs in XML manifest files...\033[0m"
          HAS_FAILURE='false'
          for xml_file in "/var/www/glpi/plugins/$PLUGIN_KEY/plugin.xml" "/var/www/glpi/plugins/$PLUGIN_KEY/${PLUGIN_KEY}.xml"; do
            [[ -f "$xml_file" ]] || continue
            echo "Checking $(basename "$xml_file")..."
            while IFS= read -r url; do
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --location "$url")
              if [[ "$status" -ge 200 && "$status" -lt 400 ]]; then
                echo "✅ $url ($status)"
              elif echo "$new_download_urls" | grep -qxF "$url"; then
                echo "⚠️ $url ($status, new release archive may not be published yet)"
              else
                echo "❌ $url ($status)"
                HAS_FAILURE='true'
              fi
            done < <(grep -oP 'https?://[^\s<>"()]+' "$xml_file" | sort -u)
          done
          if [[ "$HAS_FAILURE" == 'true' ]]; then
            echo -e "\033[0;31mSome URLs are invalid or unreachable.\033[0m"
            exit 1
          fi
          echo "✅ All URLs are valid."
      - name: "PHP Parallel Lint"
        run: |
          echo -e "\033[0;33mExecuting PHP Parallel Lint...\033[0m"
          if [[ -f "vendor/bin/parallel-lint" ]]; then
            vendor/bin/parallel-lint --show-deprecated --colors --exclude ./lib/ --exclude ./node_modules/ --exclude ./vendor/ --no-progress .
          elif [[ -f "../../vendor/bin/parallel-lint" ]]; then
            ../../vendor/bin/parallel-lint --show-deprecated --colors --exclude ./lib/ --exclude ./node_modules/ --exclude ./vendor/ --no-progress .
          else
            echo -e "\033[0;31mPHP Parallel Lint binary not found!\033[0m"
            exit 1
          fi
      - name: "PHP CodeSniffer"
        if: ${{ !cancelled() && hashFiles(format('{0}/.phpcs.xml', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting PHP CodeSniffer...\033[0m"
          if [[ -f "vendor/bin/phpcs" ]]; then
            vendor/bin/phpcs
          elif [[ -f "../../vendor/bin/phpcs" ]]; then
            ../../vendor/bin/phpcs
          else
            echo -e "\033[0;31mPHP CodeSniffer binary not found!\033[0m"
            exit 1
          fi
      - name: "PHP-CS-Fixer"
        if: ${{ !cancelled() && hashFiles(format('{0}/.php-cs-fixer.php', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting PHP-CS-Fixer...\033[0m"
          if [[ -f "vendor/bin/php-cs-fixer" ]]; then
            PHP_CS_FIXER_IGNORE_ENV=1 vendor/bin/php-cs-fixer check --config=.php-cs-fixer.php --no-interaction --show-progress none
          elif [[ -f "../../vendor/bin/php-cs-fixer" ]]; then
            PHP_CS_FIXER_IGNORE_ENV=1 php ../../vendor/bin/php-cs-fixer check --config=.php-cs-fixer.php --no-interaction --show-progress none
          else
            echo -e "\033[0;31mPHP-CS-Fixer binary not found!\033[0m"
            exit 1
          fi
      - name: "PHPStan"
        if: ${{ !cancelled() && hashFiles(format('{0}/phpstan.neon', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting PHPStan...\033[0m"
          if [[ -f "vendor/bin/phpstan" ]]; then
            vendor/bin/phpstan analyze --ansi --memory-limit=2G --no-interaction --no-progress
          elif [[ -f "../../vendor/bin/phpstan" ]]; then
            ../../vendor/bin/phpstan analyze --ansi --memory-limit=2G --no-interaction --no-progress
          else
            echo -e "\033[0;31mPHPStan binary not found!\033[0m"
            exit 1
          fi
      - name: "Psalm"
        if: ${{ !cancelled() && hashFiles(format('{0}/psalm.xml', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting Psalm...\033[0m"
          if [[ -f "vendor/bin/psalm" ]]; then
            vendor/bin/psalm --long-progress --output-format=github
          elif [[ -f "../../vendor/bin/psalm" ]]; then
            ../../vendor/bin/psalm --long-progress --output-format=github
          else
            echo -e "\033[0;31mPsalm binary not found!\033[0m"
            exit 1
          fi
      - name: "Rector"
        if: ${{ !cancelled() && hashFiles(format('{0}/rector.php', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting Rector...\033[0m"
          if [[ -f "vendor/bin/rector" ]]; then
            vendor/bin/rector process --dry-run --ansi
          elif [[ -f "../../vendor/bin/rector" ]]; then
            ../../vendor/bin/rector process --dry-run --ansi
          else
            echo -e "\033[0;31mRector binary not found!\033[0m"
            exit 1
          fi
      - name: "JS Lint"
        if: ${{ !cancelled() && (hashFiles(format('{0}/eslint.config.js', inputs.plugin-key)) != '' || hashFiles(format('{0}/eslint.config.mjs', inputs.plugin-key)) != '' || hashFiles(format('{0}/eslint.config.cjs', inputs.plugin-key)) != '' || hashFiles(format('{0}/.eslintrc.js', inputs.plugin-key)) != '') }}
        run: |
          echo -e "\033[0;33mExecuting ESLint...\033[0m"
          if [[ -f "node_modules/.bin/eslint" ]]; then
            node_modules/.bin/eslint --color .
          elif [[ -f "../../node_modules/.bin/eslint" ]]; then
            ../../node_modules/.bin/eslint --color .
          else
            echo -e "\033[0;31mESLint binary not found!\033[0m"
            exit 1
          fi
      - name: "CSS Lint"
        if: ${{ !cancelled() && hashFiles(format('{0}/.stylelintrc.js', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting Stylelint...\033[0m"
          if [[ -f "node_modules/.bin/stylelint" ]]; then
            node_modules/.bin/stylelint --color "**/*.css" "**/*.scss"
          elif [[ -f "../../node_modules/.bin/stylelint" ]]; then
            ../../node_modules/.bin/stylelint --color "**/*.css" "**/*.scss"
          else
            echo -e "\033[0;31mStylelint binary not found!\033[0m"
            exit 1
          fi
      - name: "Licence header check"
        if: ${{ !cancelled() && hashFiles(format('{0}/tools/HEADER', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting licence headers checks...\033[0m"
          if [[ -f "vendor/bin/licence-headers-check" ]]; then
            vendor/bin/licence-headers-check --ansi --no-interaction
          elif [[ -f "../../vendor/bin/licence-headers-check" ]]; then
            ../../vendor/bin/licence-headers-check --ansi --no-interaction --header-file=tools/HEADER -d .
          elif [[ -f "../../bin/console" && -n "$(php ../../bin/console list | grep 'tools:licence_headers_check')" ]]; then
            echo -e "\033[0;33mUsing GLPI core tools:licence_headers_check command...\033[0m"
            php ../../bin/console tools:licence_headers_check --ansi --no-interaction --plugin=${{ inputs.plugin-key }}
          else
            echo -e "\033[0;31mLicence headers check binary not found!\033[0m"
            exit 1
          fi
      - name: "Install plugin"
        if: ${{ !cancelled() }}
        working-directory: "/var/www/glpi"
        run: |
          bin/console database:install --ansi --no-interaction --db-name=glpi --db-host=db --db-user=root --db-password="" --strict-configuration
          php bin/console config:set url_base "http://localhost"
          php bin/console config:set url_base_api "http://localhost/apirest.php"
          bin/console plugin:install --ansi --no-interaction --username=glpi ${{ inputs.plugin-key }}
          bin/console plugin:activate --ansi --no-interaction ${{ inputs.plugin-key }}
      - name: "Run apache"
        if: ${{ !cancelled() }}
        # Use default `bash` shell with `github-actions-runner` user
        shell: "bash"
        run: |
          sudo service apache2 start
      - name: "PHPUnit"
        if: ${{ !cancelled() && hashFiles(format('{0}/phpunit.xml', inputs.plugin-key)) != '' }}
        env:
          EXTRA_ENV: ${{ secrets.extra-env }}
        run: |
          echo -e "\033[0;33mExecuting PHPUnit...\033[0m"
          PHPUNIT_FLAGS="--colors=always"
          PHP_FLAGS=""

          if [[ -n "$EXTRA_ENV" ]]; then
            set -a
            source <(echo "$EXTRA_ENV")
            set +a
          fi

          if [[ "${{ steps.coverage-config.outputs.coverage-enabled }}" == "true" ]]; then
            PHPUNIT_FLAGS="$PHPUNIT_FLAGS --coverage-text --coverage-cobertura=cobertura.xml --coverage-clover=clover.xml"
            # pcov is installed in the image but disabled by default (pcov.enabled=0).
            # Enabling it and scoping it to only the plugin. No need to run coverage on the rest of GLPI code.
            PHP_FLAGS="-d pcov.enabled=1 -d pcov.directory=."
          fi

          if grep -qi 'testdox="true"' phpunit.xml; then
            sed -i 's/ testdox="true"//gI' phpunit.xml
          fi

          if [[ -f "vendor/bin/phpunit" ]]; then
            php $PHP_FLAGS vendor/bin/phpunit $PHPUNIT_FLAGS
          elif [[ -f "../../vendor/bin/phpunit" ]]; then
            php $PHP_FLAGS ../../vendor/bin/phpunit $PHPUNIT_FLAGS
          else
            echo -e "\033[0;31mPHPUnit binary not found!\033[0m"
            exit 1
          fi
      - name: "Fix coverage paths for IDE import"
        if: ${{ !cancelled() && steps.coverage-config.outputs.coverage-enabled == 'true' }}
        run: |
          echo "Sanitizing paths in clover.xml..."
          sed -i 's|/var/www/glpi/plugins/${{ inputs.plugin-key }}/|plugins/${{ inputs.plugin-key }}/|g' clover.xml
      - name: "Upload coverage report"
        uses: "actions/upload-artifact@v7"
        if: ${{ !cancelled() && steps.coverage-config.outputs.coverage-enabled == 'true' }}
        with:
          name: "coverage-report"
          path: |
            /var/www/glpi/plugins/${{ inputs.plugin-key }}/cobertura.xml
            /var/www/glpi/plugins/${{ inputs.plugin-key }}/clover.xml
            /var/www/glpi/plugins/${{ inputs.plugin-key }}/.glpi-coverage.json
          include-hidden-files: true
          overwrite: true
      - name: "Jest"
        if: ${{ !cancelled() && hashFiles(format('{0}/jest.config.js', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting Jest...\033[0m"
          if [[ -f "node_modules/.bin/jest" ]]; then
            NODE_OPTIONS="--experimental-vm-modules" node_modules/.bin/jest --colors --forceExit
          elif [[ -f "../../node_modules/.bin/jest" ]]; then
            NODE_OPTIONS="--experimental-vm-modules" ../../node_modules/.bin/jest --colors --forceExit
          else
            echo -e "\033[0;31mJest binary not found!\033[0m"
            exit 1
          fi
      - name: "TwigCS"
        if: ${{ !cancelled() && hashFiles(format('{0}/.twig_cs.dist.php', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting TwigCS...\033[0m"
          if [[ -f "vendor/bin/twigcs" ]]; then
            vendor/bin/twigcs
          elif [[ -f "../../vendor/bin/twigcs" ]]; then
            ../../vendor/bin/twigcs
          else
            echo -e "\033[0;31mTwigCS binary not found!\033[0m"
            exit 1
          fi
      - name: "Check plugin uninstall cleanliness"
        if: ${{ !cancelled() }}
        working-directory: "/var/www/glpi"
        run: |
          echo -e "\033[0;33mDeactivating plugin...\033[0m"
          bin/console plugin:deactivate --ansi --no-interaction ${{ inputs.plugin-key }}
          echo -e "\033[0;33mUninstalling plugin...\033[0m"
          bin/console plugin:uninstall --ansi --no-interaction ${{ inputs.plugin-key }}
          cat > /tmp/check-uninstall.php << 'PHPEOF'
          <?php
          $plugin_key   = $argv[1] ?? '';
          $class_prefix = 'Plugin' . ucfirst($plugin_key);
          $ns_prefix    = 'GlpiPlugin\\\\' . ucfirst($plugin_key) . '\\\\';
          if ($plugin_key === '') {
              fwrite(STDERR, "Usage: php check-uninstall.php <plugin-key>\n");
              exit(1);
          }
          mysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);
          $db = new mysqli('db', 'root', '', 'glpi');
          $failures = false;
          echo "\033[0;33mChecking for leftover database tables...\033[0m\n";
          $result = $db->query("SHOW TABLES LIKE 'glpi_plugin_{$plugin_key}_%'");
          $tables = [];
          while ($row = $result->fetch_row()) {
              $tables[] = $row[0];
          }
          if ($tables) {
              echo "❌ Leftover tables after uninstall:\n" . implode("\n", $tables) . "\n";
              $failures = true;
          } else {
              echo "✅ No leftover tables.\n";
          }
          foreach ([
              ['Checking for leftover plugin configuration...', "SELECT COUNT(*) FROM glpi_configs WHERE context = 'plugin:{$plugin_key}'",        'row(s) in glpi_configs'],
              ['Checking for leftover cron tasks...',           "SELECT COUNT(*) FROM glpi_crontasks WHERE itemtype LIKE '{$class_prefix}%' OR itemtype LIKE '{$ns_prefix}%'", 'row(s) in glpi_crontasks'],
              ['Checking for leftover profile rights...',       "SELECT COUNT(*) FROM glpi_profilerights WHERE name LIKE 'plugin_{$plugin_key}%'", 'row(s) in glpi_profilerights'],
              ['Checking for leftover display preferences...',  "SELECT COUNT(*) FROM glpi_displaypreferences WHERE itemtype LIKE '{$class_prefix}%'", 'row(s) in glpi_displaypreferences'],
          ] as [$label, $sql, $entity]) {
              echo "\033[0;33m{$label}\033[0m\n";
              $count = (int) $db->query($sql)->fetch_row()[0];
              if ($count > 0) {
                  echo "❌ {$count} leftover {$entity}.\n";
                  $failures = true;
              } else {
                  echo "✅ None.\n";
              }
          }
          if ($failures) {
              fwrite(STDERR, "\033[0;31mPlugin uninstall left residual data in the database.\033[0m\n");
              exit(1);
          }
          PHPEOF
          php /tmp/check-uninstall.php ${{ inputs.plugin-key }}
