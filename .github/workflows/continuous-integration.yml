name: "Continuous integration"

on:
  workflow_call:
    inputs:
      plugin-key:
        required: true
        type: string
      glpi-version:
        required: true
        type: string
      php-version:
        required: true
        type: string
      db-image:
        required: true
        type: string
      init-script:
        required: false
        type: string
        default: ""
      extra-services:
        description: "A list of coma separated services. Available services: openldap."
        required: false
        type: string
        default: ""

jobs:
  ci:
    name: "Continuous integration"
    runs-on: "ubuntu-latest"
    container:
      image: "ghcr.io/glpi-project/githubactions-glpi-apache:php-${{ inputs.php-version }}-glpi-${{ inputs.glpi-version }}"
      # `--user github-actions-runner` is mandatory to prevent rights issues on mounted volume during checkout operation
      options: >-
        --volume ${{ github.workspace }}:/var/www/glpi/plugins:rw
        --user github-actions-runner
    services:
      db:
        image: "ghcr.io/glpi-project/githubactions-${{ inputs.db-image }}"
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: "glpi"
        options: >-
          --shm-size=1g
      openldap:
        # Workaround to only add the service if a given variable is set.
        # See: https://github.com/actions/runner/issues/822
        image: "${{ contains(inputs.extra-services, 'openldap') && 'osixia/openldap:latest' || '' }}"
        env:
          LDAP_ORGANISATION: "GLPI"
          LDAP_DOMAIN: "glpi.org"
          LDAP_ADMIN_USERNAME: "admin"
          LDAP_ADMIN_PASSWORD: "admin"
    defaults:
      run:
        # By default, execute commands using the `www-data` user to prevent rights issues on GLPI generated files.
        shell: "sudo --set-home --user=www-data --preserve-env bash --noprofile --norc -eo pipefail {0}"
        working-directory: "/var/www/glpi/plugins/${{ inputs.plugin-key }}"
    env:
      CACHE_DIR: "/home/www-data/.cache/continuous-integration-workflow"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v5"
        with:
          path: "${{ inputs.plugin-key }}"
      - name: "Execute init script"
        if: ${{ inputs.init-script != '' }}
        # Use default `bash` shell with `github-actions-runner` user
        shell: "bash"
        run: |
          bash --noprofile --norc ${{ inputs.init-script }}
      - name: "Configure cache directories"
        if: ${{ !cancelled() }}
        # Use default `bash` shell with `github-actions-runner` user
        shell: "bash"
        run: |
          sudo mkdir --parents "${{ env.CACHE_DIR }}/npm"
          sudo mkdir --parents "${{ env.CACHE_DIR }}/composer"
          sudo chown --recursive github-actions-runner "${{ env.CACHE_DIR }}"
          npm config set cache "${{ env.CACHE_DIR }}/npm"
          composer config cache-dir "${{ env.CACHE_DIR }}/composer"
      - name: "Restore cache"
        if: ${{ !cancelled() }}
        uses: "actions/cache@v4"
        with:
          path: |
            ${{ env.CACHE_DIR }}
          key: "${{ inputs.plugin-key }}-dependencies-${{ inputs.php-version }}-${{ github.job }}-${{ hashFiles('**/composer.lock', '**/package-lock.json') }}"
          restore-keys: |
            ${{ inputs.plugin-key }}-dependencies-${{ inputs.php-version }}-${{ github.job }}-
            ${{ inputs.plugin-key }}-dependencies-${{ inputs.php-version }}-
            ${{ inputs.plugin-key }}-dependencies-
      - name: "Fix directories ACL"
        if: ${{ !cancelled() }}
        # Use default `bash` shell with `github-actions-runner` user
        shell: "bash"
        run: |
          sudo setfacl --recursive --modify u:www-data:rwx "${{ env.CACHE_DIR }}"
          sudo setfacl --recursive --modify u:www-data:rwx /var/www/glpi/plugins
      - name: "Install composer dependencies"
        if: ${{ !cancelled() && hashFiles(format('{0}/composer.json', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mMark plugin directory as safe...\033[0m"
          git config --global --add safe.directory "/var/www/glpi/plugins/${{ inputs.plugin-key }}"
          echo -e "\033[0;33mExecuting Composer install...\033[0m"
          composer install --ansi --no-interaction --no-progress --prefer-dist
      - name: "Check for common dependencies"
        if: ${{ !cancelled() && hashFiles(format('{0}/composer.json', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mChecking for common dependencies between plugin and core...\033[0m"
          PLUGIN_DEPS=$(composer show --direct --format=json | jq -r '.installed[] | .name')
          CORE_DEPS=$(cd ../../ && composer show --direct --format=json | jq -r '.installed[] | .name')
          HAS_MATCH='false'
          for plugin_dep in $PLUGIN_DEPS; do
            for core_dep in $CORE_DEPS; do
              if [[ "$plugin_dep" == "$core_dep" && "$plugin_dep" != "glpi-project/tools" ]]; then
                echo "❌ Conflict: '$plugin_dep' is present in both plugin and core."
                HAS_MATCH='true'
              fi
            done
          done
          if [[ "$HAS_MATCH" == 'true' ]]; then
            echo -e "\033[0;31mDependency conflicts detected. Please resolve them before proceeding.\033[0m"
            exit 1
          fi
          echo "✅ No dependency conflicts detected."
      - name: "Install npm dependencies"
        if: ${{ !cancelled() && hashFiles(format('{0}/package.json', inputs.plugin-key)) != '' }}
        run: |
          npm install --no-save
      # We now need to load the ldif data in the openldap server.
      # TODO: bake the .ldif directly in a custom image so we don't need to do this.
      - name: "Import LDIF"
        if: ${{ contains(inputs.extra-services, 'openldap') }}
        run: |
          ldapadd -x -D "cn=admin,dc=glpi,dc=org" -w admin \
            -f ../../tests/LDAP/ldif/10-users.ldif \
            -H ldap://openldap:389
      - name: "PHP Parallel Lint"
        run: |
          echo -e "\033[0;33mExecuting PHP Parallel Lint...\033[0m"
          if [[ -f "vendor/bin/parallel-lint" ]]; then
            vendor/bin/parallel-lint --show-deprecated --colors --exclude ./lib/ --exclude ./node_modules/ --exclude ./vendor/ --no-progress .
          elif [[ -f "../../vendor/bin/parallel-lint" ]]; then
            ../../vendor/bin/parallel-lint --show-deprecated --colors --exclude ./lib/ --exclude ./node_modules/ --exclude ./vendor/ --no-progress .
          else
            echo -e "\033[0;31mPHP Parallel Lint binary not found!\033[0m"
            exit 1
          fi
      - name: "PHP CodeSniffer"
        if: ${{ !cancelled() && hashFiles(format('{0}/.phpcs.xml', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting PHP CodeSniffer...\033[0m"
          if [[ -f "vendor/bin/phpcs" ]]; then
            vendor/bin/phpcs
          elif [[ -f "../../vendor/bin/phpcs" ]]; then
            ../../vendor/bin/phpcs
          else
            echo -e "\033[0;31mPHP CodeSniffer binary not found!\033[0m"
            exit 1
          fi
      - name: "PHP-CS-Fixer"
        if: ${{ !cancelled() && hashFiles(format('{0}/.php-cs-fixer.php', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting PHP-CS-Fixer...\033[0m"
          if [[ -f "vendor/bin/php-cs-fixer" ]]; then
            PHP_CS_FIXER_IGNORE_ENV=1 vendor/bin/php-cs-fixer check --config=.php-cs-fixer.php --no-interaction --show-progress none
          elif [[ -f "../../vendor/bin/php-cs-fixer" ]]; then
            PHP_CS_FIXER_IGNORE_ENV=1 php ../../vendor/bin/php-cs-fixer check --config=.php-cs-fixer.php --no-interaction --show-progress none
          else
            echo -e "\033[0;31mPHP-CS-Fixer binary not found!\033[0m"
            exit 1
          fi
      - name: "PHPStan"
        if: ${{ !cancelled() && hashFiles(format('{0}/phpstan.neon', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting PHPStan...\033[0m"
          if [[ -f "vendor/bin/phpstan" ]]; then
            vendor/bin/phpstan analyze --ansi --memory-limit=2G --no-interaction --no-progress
          elif [[ -f "../../vendor/bin/phpstan" ]]; then
            ../../vendor/bin/phpstan analyze --ansi --memory-limit=2G --no-interaction --no-progress
          else
            echo -e "\033[0;31mPHPStan binary not found!\033[0m"
            exit 1
          fi
      - name: "Psalm"
        if: ${{ !cancelled() && hashFiles(format('{0}/psalm.xml', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting Psalm...\033[0m"
          if [[ -f "vendor/bin/psalm" ]]; then
            vendor/bin/psalm --long-progress --output-format=github
          elif [[ -f "../../vendor/bin/psalm" ]]; then
            ../../vendor/bin/psalm --long-progress --output-format=github
          else
            echo -e "\033[0;31mPsalm binary not found!\033[0m"
            exit 1
          fi
      - name: "Rector"
        if: ${{ !cancelled() && hashFiles(format('{0}/rector.php', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting Rector...\033[0m"
          if [[ -f "vendor/bin/rector" ]]; then
            vendor/bin/rector process --dry-run --ansi
          elif [[ -f "../../vendor/bin/rector" ]]; then
            ../../vendor/bin/rector process --dry-run --ansi
          else
            echo -e "\033[0;31mRector binary not found!\033[0m"
            exit 1
          fi
      - name: "JS Lint"
        if: ${{ !cancelled() && (hashFiles(format('{0}/eslint.config.js', inputs.plugin-key)) != '' || hashFiles(format('{0}/eslint.config.mjs', inputs.plugin-key)) != '' || hashFiles(format('{0}/eslint.config.cjs', inputs.plugin-key)) != '' || hashFiles(format('{0}/.eslintrc.js', inputs.plugin-key)) != '') }}
        run: |
          echo -e "\033[0;33mExecuting ESLint...\033[0m"
          if [[ -f "node_modules/.bin/eslint" ]]; then
            node_modules/.bin/eslint --color .
          elif [[ -f "../../node_modules/.bin/eslint" ]]; then
            ../../node_modules/.bin/eslint --color .
          else
            echo -e "\033[0;31mESLint binary not found!\033[0m"
            exit 1
          fi
      - name: "CSS Lint"
        if: ${{ !cancelled() && hashFiles(format('{0}/.stylelintrc.js', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting Stylelint...\033[0m"
          if [[ -f "node_modules/.bin/stylelint" ]]; then
            node_modules/.bin/stylelint --color "**/*.css" "**/*.scss"
          elif [[ -f "../../node_modules/.bin/stylelint" ]]; then
            ../../node_modules/.bin/stylelint --color "**/*.css" "**/*.scss"
          else
            echo -e "\033[0;31mStylelint binary not found!\033[0m"
            exit 1
          fi
      - name: "Misc lint"
        if: ${{ !cancelled() && hashFiles(format('{0}/tools/HEADER', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting licence headers checks...\033[0m"
          if [[ -f "vendor/bin/licence-headers-check" ]]; then
            vendor/bin/licence-headers-check --ansi --no-interaction
          elif [[ -f "../../vendor/bin/licence-headers-check" ]]; then
            ../../vendor/bin/licence-headers-check --ansi --no-interaction --header-file=tools/HEADER -d .
          else
            echo -e "\033[0;31mLicence headers check binary not found!\033[0m"
            exit 1
          fi
      - name: "Install plugin"
        if: ${{ !cancelled() }}
        working-directory: "/var/www/glpi"
        run: |
          bin/console database:install --ansi --no-interaction --db-name=glpi --db-host=db --db-user=root --db-password="" --strict-configuration
          php bin/console config:set url_base "http://localhost"
          php bin/console config:set url_base_api "http://localhost/apirest.php"
          bin/console plugin:install --ansi --no-interaction --username=glpi ${{ inputs.plugin-key }}
          bin/console plugin:activate --ansi --no-interaction ${{ inputs.plugin-key }}
      - name: "Run apache"
        if: ${{ !cancelled() }}
        # Use default `bash` shell with `github-actions-runner` user
        shell: "bash"
        run: |
          sudo service apache2 start
      - name: "PHPUnit"
        if: ${{ !cancelled() && hashFiles(format('{0}/phpunit.xml', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting PHPUnit...\033[0m"
          if [[ -f "vendor/bin/phpunit" ]]; then
            vendor/bin/phpunit --colors=always
          elif [[ -f "../../vendor/bin/phpunit" ]]; then
            ../../vendor/bin/phpunit --colors=always
          else
            echo -e "\033[0;31mPHPUnit binary not found!\033[0m"
            exit 1
          fi
      - name: "Jest"
        if: ${{ !cancelled() && hashFiles(format('{0}/jest.config.js', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting Jest...\033[0m"
          if [[ -f "node_modules/.bin/jest" ]]; then
            NODE_OPTIONS="--experimental-vm-modules" node_modules/.bin/jest --colors --forceExit
          elif [[ -f "../../node_modules/.bin/jest" ]]; then
            NODE_OPTIONS="--experimental-vm-modules" ../../node_modules/.bin/jest --colors --forceExit
          else
            echo -e "\033[0;31mJest binary not found!\033[0m"
            exit 1
          fi
      - name: "TwigCS"
        if: ${{ !cancelled() && hashFiles(format('{0}/.twig_cs.dist.php', inputs.plugin-key)) != '' }}
        run: |
          echo -e "\033[0;33mExecuting TwigCS...\033[0m"
          if [[ -f "vendor/bin/twigcs" ]]; then
            vendor/bin/twigcs
          elif [[ -f "../../vendor/bin/twigcs" ]]; then
            ../../vendor/bin/twigcs
          else
            echo -e "\033[0;31mTwigCS binary not found!\033[0m"
            exit 1
          fi
